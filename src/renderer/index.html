<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Horizon Timer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div id="app">
    <!-- Horizon Line - The pixel-thin timer bar -->
    <div id="horizon-line"></div>

    <!-- Floating Timer Display - Always visible with adjustable transparency -->
    <div id="floating-timer" class="floating-timer hidden">
      <span id="floating-time">25:00</span>
    </div>

    <!-- Controls Panel - Appears on hover -->
    <div id="controls-panel" class="hidden">
      <div class="controls-content">
        <!-- Timer Display -->
        <div class="timer-section">
          <div id="timer-display" class="timer-display">25:00</div>
          <div id="timer-label" class="timer-label">Focus Time</div>
        </div>

        <!-- Timer Controls -->
        <div class="button-section">
          <button id="btn-start" class="control-btn primary">Start</button>
          <button id="btn-pause" class="control-btn hidden">Pause</button>
          <button id="btn-end" class="control-btn hidden">End</button>
        </div>

        <!-- Duration Presets -->
        <div class="preset-section">
          <button class="preset-btn" data-minutes="15">15m</button>
          <button class="preset-btn active" data-minutes="25">25m</button>
          <button class="preset-btn" data-minutes="45">45m</button>
          <button class="preset-btn" data-minutes="60">60m</button>
        </div>

        <!-- Custom Time Input -->
        <div class="custom-time-section">
          <label for="custom-time" class="custom-label">Custom:</label>
          <input type="range" id="custom-time" class="custom-time-slider" min="1" max="60" value="25" step="1">
          <span id="custom-time-value" class="custom-time-value">25m</span>
        </div>

        <!-- Audio Controls -->
        <div class="audio-section">
          <button id="btn-noise" class="control-btn small">
            <span class="icon">🔇</span>
            <span class="label">Noise</span>
          </button>
          <input type="range" id="noise-volume" min="0" max="100" value="30" class="volume-slider">
          <button id="btn-auto-noise" class="control-btn small" title="Auto-start noise with timer">
            <span class="icon">🔗</span>
          </button>
          <input type="range" id="alarm-volume" min="0" max="100" value="50" class="volume-slider" title="Alarm volume">
        </div>

        <!-- Display Settings -->
        <div class="display-section">
          <button id="btn-show-timer" class="control-btn small">
            <span class="icon">🕐</span>
            <span class="label">Timer</span>
          </button>
          <input type="range" id="timer-opacity" min="10" max="100" value="50" class="opacity-slider"
            title="Timer opacity">
          <button id="btn-display-mode" class="control-btn small" title="Toggle display mode">
            <span class="icon">🖥️</span>
            <span class="label">All</span>
          </button>
        </div>

        <!-- Analytics Button -->
        <div class="analytics-section">
          <button id="btn-analytics" class="control-btn small">
            <span class="icon">📊</span>
            <span class="label">Stats</span>
          </button>
          <div id="capture-count" class="capture-badge">0</div>
        </div>

        <!-- Auto-Start Toggle -->
        <div class="autostart-section">
          <button id="btn-auto-start" class="control-btn small" title="Run at Windows startup">
            <span class="icon">🚀</span>
            <span class="label">Auto</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Analytics Panel -->
    <div id="analytics-panel" class="panel analytics-dashboard hidden">
      <div class="panel-header">
        <h3>📊 Session Analytics</h3>
        <div class="header-actions">
          <button id="export-data" class="control-btn small" title="Export data">
            <span class="icon">💾</span>
            <span class="label">Export</span>
          </button>
        </div>
      </div>
      <div class="panel-content analytics-content">
        <!-- Top Section: Stats + Heatmap side by side -->
        <div class="overview-section">
          <!-- Overview Stats -->
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-value" id="stat-sessions">0</div>
              <div class="stat-label">Sessions</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-total-time">0h</div>
              <div class="stat-label">Total Time</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-avg-duration">--</div>
              <div class="stat-label">Avg Session</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-success-rate">--</div>
              <div class="stat-label">Success</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-streak">0</div>
              <div class="stat-label">Streak</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-week-sessions">0</div>
              <div class="stat-label">This Week</div>
            </div>
          </div>

          <!-- Activity Heatmap -->
          <div class="activity-heatmap">
            <h4>Activity</h4>
            <div id="heatmap-container" class="heatmap-grid"></div>
          </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
          <div class="chart-container">
            <h4>Sessions (Last 30 Days)</h4>
            <canvas id="chart-daily-sessions"></canvas>
          </div>
          <div class="chart-container">
            <h4>Phase Distribution</h4>
            <canvas id="chart-phase-distribution"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Session End Rating -->
    <div id="rating-panel" class="panel hidden">
      <div class="panel-content centered">
        <h3>Session Complete!</h3>
        <p class="session-summary" id="session-summary">Great focus session</p>
        <div class="rating-stars">
          <button class="star-btn" data-rating="1">★</button>
          <button class="star-btn" data-rating="2">★</button>
          <button class="star-btn" data-rating="3">★</button>
          <button class="star-btn" data-rating="4">★</button>
          <button class="star-btn" data-rating="5">★</button>
        </div>
        <p class="rating-hint">Rate your focus quality (optional)</p>
        <button id="skip-rating" class="control-btn small">Skip</button>
      </div>
    </div>
  </div>

  <!-- Chart.js for analytics visualizations -->
  <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>

  <script src="components/timer.js"></script>
  <script src="components/audio.js"></script>
  <script src="components/hover.js"></script>
  <script src="components/SessionTracker.js"></script>
  <script src="components/analytics.js"></script>
  <script src="components/analyticsDashboard.js"></script>
  <script src="app.js"></script>
</body>

</html>
